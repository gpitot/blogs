name = "blog-to-epub"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "EPUB_CACHE"
id = "placeholder-replace-with-real-id"
preview_id = "placeholder-replace-with-real-preview-id"

[triggers]
# Compile weekly book from subscription articles every Monday at midnight UTC
crons = ["0 0 * * 1"]

