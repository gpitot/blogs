AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Blog-to-EPUB converter — Lambda + DynamoDB + S3

# ---------------------------------------------------------------------------
# Parameters (set via samconfig.toml or --parameter-overrides)
# ---------------------------------------------------------------------------
Parameters:
  ResendApiKey:
    Type: String
    Default: ''
    NoEcho: true
  ResendFromAddress:
    Type: String
    Default: ''
  EmailAllowlist:
    Type: String
    Default: ''

# ---------------------------------------------------------------------------
# Shared defaults for all Lambda functions
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 512
    Environment:
      Variables:
        DEPLOY_VERSION: '2'
        LOG_LEVEL: 'info'
        DYNAMO_TABLE_NAME: !Ref BlogEpubTable
        S3_BUCKET_NAME: !Ref EpubBucket
        RESEND_API_KEY: !Ref ResendApiKey
        RESEND_FROM_ADDRESS: !Ref ResendFromAddress
        EMAIL_ALLOWLIST: !Ref EmailAllowlist

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # ── DynamoDB ───────────────────────────────────────────────────────────────
  BlogEpubTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-blog-epub'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── S3 ────────────────────────────────────────────────────────────────────
  EpubBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-epub-store-${AWS::AccountId}'
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSingleArticleEpubs
            Status: Enabled
            Prefix: epub/
            ExpirationInDays: 7
          - Id: ExpireWeeklyEpubs
            Status: Enabled
            Prefix: weekly/
            ExpirationInDays: 60

  # ── HTTP API Lambda ────────────────────────────────────────────────────────
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/index.ts
        External:
          - '@aws-sdk/*'
          - sharp
    Properties:
      Handler: index.handler
      Timeout: 300  # 5 minutes — enough for articles with many images
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlogEpubTable
        - S3CrudPolicy:
            BucketName: !Ref EpubBucket
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ['*']
          AllowMethods: ['GET', 'POST']
          AllowHeaders: ['content-type']

  # ── Weekly cron Lambda ────────────────────────────────────────────────────
  WeeklyFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/weekly.ts
        External:
          - '@aws-sdk/*'
          - sharp
    Properties:
      Handler: weekly.handler
      Timeout: 900  # 15 minutes
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlogEpubTable
        - S3CrudPolicy:
            BucketName: !Ref EpubBucket
      Events:
        WeeklyCron:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: 'cron(0 0 ? * MON *)'
            Description: 'Compile weekly reading EPUB every Monday at midnight UTC'
            RetryPolicy:
              MaximumRetryAttempts: 1

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  ApiUrl:
    Description: 'Lambda Function URL for the HTTP API'
    Value: !GetAtt ApiFunctionUrl.FunctionUrl

  TableName:
    Description: 'DynamoDB table name'
    Value: !Ref BlogEpubTable

  BucketName:
    Description: 'S3 bucket for EPUB storage'
    Value: !Ref EpubBucket
