AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Blog-to-EPUB converter — Lambda + DynamoDB + S3

# ---------------------------------------------------------------------------
# Parameters (set via samconfig.toml or --parameter-overrides)
# ---------------------------------------------------------------------------
Parameters:
  ResendFromAddress:
    Type: String
    Default: ''
  EmailAllowlist:
    Type: String
    Default: ''
  ProxyUrl:
    Type: String
    Default: ''

# ---------------------------------------------------------------------------
# Shared defaults for all Lambda functions
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 512
    Environment:
      Variables:
        DEPLOY_VERSION: '2'
        LOG_LEVEL: 'info'
        DYNAMO_TABLE_NAME: !Ref BlogEpubTable
        S3_BUCKET_NAME: !Ref EpubBucket
        RESEND_FROM_ADDRESS: !Ref ResendFromAddress
        EMAIL_ALLOWLIST: !Ref EmailAllowlist
        PROXY_URL: !Ref ProxyUrl
        SSM_RESEND_API_KEY_PARAM: /blogs/resend-api-key
        SSM_PROXY_SECRET_PARAM: /blogs/proxy-secret
        FETCH_POSTS_QUEUE_URL: !Ref FetchPostsQueue
        CONVERT_ARTICLE_QUEUE_URL: !Ref ConvertArticleQueue

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # ── SQS Queues ────────────────────────────────────────────────────────────
  FetchPostsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 300
      MessageRetentionPeriod: 86400  # 1 day

  ConvertArticleQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 300
      MessageRetentionPeriod: 86400  # 1 day

  # ── DynamoDB ───────────────────────────────────────────────────────────────
  BlogEpubTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-blog-epub'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── S3 ────────────────────────────────────────────────────────────────────
  EpubBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-epub-store-${AWS::AccountId}'
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSingleArticleEpubs
            Status: Enabled
            Prefix: epub/
            ExpirationInDays: 7
          - Id: ExpireWeeklyEpubs
            Status: Enabled
            Prefix: weekly/
            ExpirationInDays: 60

  # ── HTTP API Lambda ────────────────────────────────────────────────────────
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/index.ts
        External:
          - '@aws-sdk/*'
          - sharp
    Properties:
      Handler: index.handler
      Timeout: 300  # 5 minutes — enough for articles with many images
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlogEpubTable
        - S3CrudPolicy:
            BucketName: !Ref EpubBucket
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameters
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/blogs/resend-api-key'
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/blogs/proxy-secret'
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm'
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt FetchPostsQueue.Arn
      FunctionUrlConfig:
        AuthType: NONE

  # ── Weekly cron Lambda ────────────────────────────────────────────────────
  WeeklyFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/weekly.ts
        External:
          - '@aws-sdk/*'
          - sharp
    Properties:
      Handler: weekly.handler
      Timeout: 900  # 15 minutes
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlogEpubTable
        - S3CrudPolicy:
            BucketName: !Ref EpubBucket
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameters
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/blogs/resend-api-key'
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/blogs/proxy-secret'
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm'
      Events:
        WeeklyCron:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: 'cron(0 0 ? * MON *)'
            Description: 'Compile weekly reading EPUB every Monday at midnight UTC'
            RetryPolicy:
              MaximumRetryAttempts: 1

  # ── Daily cron Lambda ─────────────────────────────────────────────────────
  DailyFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/daily.ts
        External:
          - '@aws-sdk/*'
          - sharp
    Properties:
      Handler: daily.handler
      Timeout: 60
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BlogEpubTable
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt FetchPostsQueue.Arn
      Events:
        DailyCron:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: 'cron(0 6 * * ? *)'
            Description: 'Trigger post fetching for all subscriptions daily at 6am UTC'
            RetryPolicy:
              MaximumRetryAttempts: 1

  # ── Fetch posts Lambda ────────────────────────────────────────────────────
  FetchPostsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/fetch-posts.ts
        External:
          - '@aws-sdk/*'
          - sharp
    Properties:
      Handler: fetch-posts.handler
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlogEpubTable
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt ConvertArticleQueue.Arn
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt FetchPostsQueue.Arn
      Events:
        FetchPostsQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt FetchPostsQueue.Arn
            BatchSize: 1

  # ── Convert article Lambda ────────────────────────────────────────────────
  ConvertArticleFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/convert-article.ts
        External:
          - '@aws-sdk/*'
          - sharp
    Properties:
      Handler: convert-article.handler
      Timeout: 300
      ReservedConcurrentExecutions: 5
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlogEpubTable
        - S3CrudPolicy:
            BucketName: !Ref EpubBucket
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameters
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/blogs/resend-api-key'
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/blogs/proxy-secret'
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm'
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt ConvertArticleQueue.Arn
      Events:
        ConvertArticleQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ConvertArticleQueue.Arn
            BatchSize: 1

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  ApiUrl:
    Description: 'Lambda Function URL for the HTTP API'
    Value: !GetAtt ApiFunctionUrl.FunctionUrl

  TableName:
    Description: 'DynamoDB table name'
    Value: !Ref BlogEpubTable

  BucketName:
    Description: 'S3 bucket for EPUB storage'
    Value: !Ref EpubBucket

  FetchPostsQueueUrl:
    Description: 'SQS queue URL for fetch-posts events'
    Value: !Ref FetchPostsQueue

  ConvertArticleQueueUrl:
    Description: 'SQS queue URL for convert-article events'
    Value: !Ref ConvertArticleQueue
